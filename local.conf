<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <match target="pattern">
    <test qual="any" name="family" compare="contains">
      <string>mono</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Fira Mono</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family" compare="contains">
      <string>sans</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Inter</string>
    </edit>
  </match>  

</fontconfig>
